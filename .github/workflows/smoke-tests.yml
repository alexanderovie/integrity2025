name: Smoke Tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test (preview or production)"
        required: true
      allow_production:
        description: "Set true only when intentionally testing production"
        required: false
        default: "false"

concurrency:
  group: smoke-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: ${{ github.event.inputs.base_url }}

jobs:
  smoke-tests:
    name: Smoke Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Guard production URL
        run: |
          if [[ "$BASE_URL" == "https://integritycleansolutions.com" ]] && [[ "${{ github.event.inputs.allow_production }}" != "true" ]]; then
            echo "Refusing to run smoke tests on production without explicit allow_production=true"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run Smoke Tests
        run: pnpm exec playwright test --project=${{ matrix.browser }} --reporter=list

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 3

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots-failure-${{ matrix.browser }}
          path: test-results/
          retention-days: 3

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: smoke-tests
    if: always()
    steps:
      - name: Test Summary
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.smoke-tests.result }}" = "success" ]; then
            echo "🎉 All tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Smoke tests failed. Review the smoke-tests job logs and artifacts." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
