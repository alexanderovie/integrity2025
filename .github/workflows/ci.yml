name: CI - Verify & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel previous runs if new commit pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Project
    runs-on: ubuntu-latest

    # Use Node.js 20 LTS (same as .nvmrc)
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm (from packageManager field)
        uses: pnpm/action-setup@v4
        with:
          # Don't specify version - let corepack read packageManager field
          package_json: true
          run_install: false

      - name: Verify pnpm version
        run: |
          # Validate packageManager exists and has correct format
          EXPECTED_VERSION=$(node -e "
            const pkg = require('./package.json');
            if (!pkg.packageManager) {
              console.error('❌ packageManager field missing in package.json');
              process.exit(1);
            }
            if (!pkg.packageManager.startsWith('pnpm@')) {
              console.error('❌ Invalid packageManager format. Expected: pnpm@X.Y.Z');
              process.exit(1);
            }
            console.log(pkg.packageManager.replace('pnpm@', ''));
          ")
          ACTUAL_VERSION=$(pnpm --version)
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ pnpm version mismatch: expected $EXPECTED_VERSION (from packageManager), got $ACTUAL_VERSION"
            echo "Update packageManager field in package.json or run: corepack prepare pnpm@$EXPECTED_VERSION --activate"
            exit 1
          fi
          echo "✅ pnpm version verified: $ACTUAL_VERSION (matches packageManager: pnpm@$EXPECTED_VERSION)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # Verificación implícita: si falla, lockfile está desincronizado con package.json
        # Patrón moderno (2025-2027) usado por Vercel/Linear/Stripe

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build
        env:
          # Minimal env vars for build (no secrets needed)
          NEXT_PUBLIC_APP_URL: https://example.com
        # Note: pnpm install --frozen-lockfile already protects against unexpected dependencies
        # If someone adds a prohibited dependency, they must update lockfile, which is versioned
        # Pattern: Vercel/Linear (2025-2027) - trust the lockfile as source of truth

  # Optional: Add more jobs as needed
